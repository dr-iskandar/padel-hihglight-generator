source: 0
model: yolo11n-pose.pt
output_dir: clips
show_preview: true
save_annotated: false

# Legacy single-view crop. v0.4 dual-view mode ignores this while court geometry exists.
court_roi: [0.02, 0.16, 0.98, 0.99]

# Court geometry.
# Points MUST be ordered: far_left, far_right, near_right, near_left.
# Values are normalized [x, y] coordinates in the full video frame.
# Run tools/calibrate_zones.py for the exact camera/video angle.
court_geometry:
  court_polygon:
    - [0.38, 0.28]
    - [0.69, 0.28]
    - [0.87, 0.81]
    - [0.20, 0.81]

  # Regulation service line is 3.0 m from the back wall.
  # 3.3 m gives the POC a little tolerance for bbox/pose noise.
  service_depth_m: 3.3
  center_gap_m: 0.0
  side_inset_m: 0.0

serve_detector:
  min_keypoint_conf: 0.30
  stationary_seconds: 0.35
  stationary_speed_threshold: 0.65
  prep_memory_seconds: 0.80
  prep_wrist_torso_ratio: 0.35
  swing_speed_threshold: 2.20
  wrist_lookback_seconds: 0.16
  body_lookback_seconds: 0.20
  confirm_window_seconds: 0.65
  forward_move_threshold: 0.08
  require_forward_motion: true
  cooldown_seconds: 6.0
  global_cooldown_seconds: 5.0
  stale_track_seconds: 2.0

recorder:
  pre_roll_seconds: 3.0
  post_roll_seconds: 7.0
  min_clip_seconds: 5.0
  max_clip_seconds: 15.0
  codec: mp4v

tracking:
  device: auto
  tracker: bytetrack.yaml
  iou: 0.45
  frame_stride: 2

  # v0.4: process near and far court as separate crops with separate trackers.
  # The far crop gets a lower detection threshold and larger inference size,
  # because far-side players occupy far fewer source pixels.
  dual_view: true
  view_padding: 0.06
  near_conf: 0.28
  far_conf: 0.18
  near_imgsz: 768
  far_imgsz: 1024
  max_det_per_view: 6

  # Separate ID namespaces so the two ByteTrack instances never collide.
  near_id_offset: 0
  far_id_offset: 1000

  # Debug only; set true to display the near/far AI-view boundaries.
  show_view_split: false

  # Legacy single-view fallback values.
  conf: 0.30
  imgsz: 960
  max_det: 8
